          },
          {
            "name": "size",
            "in": "query",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "name": "urgency",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "URGENT",
                "REVIEW_REQUIRED",
                "NO_TRIGGER"
              ]
            }
          },
          {
            "name": "status",
            "in": "query",
            "schema": {
              "type": "string",
              "enum": [
                "SERVER_RECEIVED",
                "ACKNOWLEDGED",
                "CLOSED"
              ]
            }
          },
          {
            "name": "patientId",
            "in": "query",
            "schema": {
              "type": "string",
              "pattern": "^SYN-[A-Za-z0-9-]{1,40}$"
            }
