  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "opaque token"
      }
    },
    "schemas": {
      "Login": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "username": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_.-]{1,64}$"
          },
          "password": {
            "type": "string",
            "format": "password",
            "minLength": 8,
            "maxLength": 72
          }
        },
        "required": [
          "username",
          "password"
        ]
      },
      "User": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "username": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "HEALTH_WORKER",
              "DOCTOR",
              "ADMIN"
            ]
          },
          "facilityId": {
            "type": "string"
          }
        },
        "required": [
          "username",
          "role",
          "facilityId"
        ]
      },
      "Session": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "token": {
            "type": "string"
          },
          "expiresAt": {
            "type": "string",
            "format": "date-time"
          },
          "user": {
            "$ref": "#/components/schemas/User"
          }
        },
        "required": [
          "token",
          "expiresAt",
          "user"
        ]
      },
      "Assessment": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "patientId": {
            "type": "string",
            "pattern": "^SYN-[A-Za-z0-9-]{1,40}$"
          },
          "measuredAt": {
            "type": "string",
            "format": "date-time"
          },
          "systolic": {
            "type": "integer",
            "nullable": true,
            "minimum": 50,
            "maximum": 300
          },
          "diastolic": {
            "type": "integer",
            "nullable": true,
            "minimum": 30,
            "maximum": 200
          },
          "gestationalWeeks": {
            "type": "integer",
            "nullable": true,
            "minimum": 0,
            "maximum": 45
          },
          "symptoms": {
            "type": "array",
            "uniqueItems": true,
            "maxItems": 7,
            "items": {
              "type": "string",
              "enum": [
                "SEVERE_HEADACHE",
                "VISUAL_DISTURBANCE",
                "UPPER_ABDOMINAL_PAIN",
                "BREATHLESSNESS",
                "SEIZURE",
                "HEAVY_BLEEDING",
                "REDUCED_FETAL_MOVEMENT"
              ]
            }
          },
          "source": {
            "type": "string",
            "enum": [
              "MANUAL",
              "DEVICE"
            ]
          },
          "ruleVersion": {
            "type": "string",
            "enum": [
              "vitalink-rules-1.0.0"
            ]
          }
        },
        "required": [
          "id",
          "patientId",
          "measuredAt",
          "symptoms",
          "source",
          "ruleVersion"
        ]
      },
      "Submission": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
