name: vitalink
services:
  database:
    image: postgres:18.1
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Generate .env using scripts/create_demo_env.py}
      POSTGRES_USER: ${POSTGRES_USER:?Generate .env using scripts/create_demo_env.py}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate .env using scripts/create_demo_env.py}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  api:
    build: ./services/api
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      VITALINK_BOOTSTRAP_USERS: ${VITALINK_BOOTSTRAP_USERS:?Generate .env using scripts/create_demo_env.py}
      API_BIND_ADDRESS: 0.0.0.0
      API_PORT: 8080
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8087:8080"
    restart: unless-stopped
  web:
    build: ./apps/web
    environment:
      API_BASE_URL: http://api:8080/api/v1
      APP_ORIGIN: http://localhost:3017
      SESSION_SECRET: ${SESSION_SECRET:?Generate .env using scripts/create_demo_env.py}
      COOKIE_SECURE: "false"
      NODE_ENV: production
    depends_on:
      - api
    ports:
      - "127.0.0.1:3017:3000"
    restart: unless-stopped
volumes:
  postgres-data:
